aid: d-matrix
name: d-Matrix
description: >-
  d-Matrix builds ultra-low-latency, energy-efficient AI inference infrastructure
  for generative AI in the datacenter. Its memory-centric compute architecture,
  next-generation I/O, and stacked-DRAM approach are delivered through the Corsair
  inference accelerator (chiplet-based, supporting models up to 100B parameters),
  the JetStream accelerator-to-accelerator communications platform, the SquadRack
  disaggregated rack-scale solution, and the 3DIMC 3D digital in-memory compute
  technology. Founded by Sid Sheth and Sudeep Bhoja and headquartered in Santa
  Clara, the company has raised roughly $450M (including a $275M Series C) from
  investors such as Qatar Investment Authority, Temasek, and SK Hynix. d-Matrix
  also maintains the open-source dmx-compressor (DMX) PyTorch toolkit for
  co-designing models to its inference hardware. This API Evangelist network
  profile tracks d-Matrix as a compute-hardware provider; it does not currently
  publish a public web API.
